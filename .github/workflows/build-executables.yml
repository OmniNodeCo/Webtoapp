name: Build native Webtoapp applications

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Website URL to package as a desktop application
        required: true
        default: https://example.com/
        type: string
      app_name:
        description: Name shown by the generated application
        required: true
        default: Webtoapp App
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} application
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Webtoapp
        run: pnpm build

      - name: Build native application
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          node lib/cli.js "$TARGET_URL" "artifacts/apps" --name "$APP_NAME" --overwrite

      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: Webtoapp-${{ matrix.os }}-${{ github.run_number }}
          path: artifacts/apps
          if-no-files-found: error
          retention-days: 30
