name: Build website app (Pake)

# Manual cloud builder: enter a URL here and GitHub builds desktop artifacts.
# End users need neither Node.js, npm, Rust, nor an installer on their computer.
on:
  workflow_dispatch:
    inputs:
      website:
        description: "HTTPS website to package"
        required: true
        type: string
      app_name:
        description: "Application name"
        required: true
        default: "My Website App"
        type: string
      width:
        description: "Initial window width"
        required: true
        default: "1280"
        type: string
      height:
        description: "Initial window height"
        required: true
        default: "820"
        type: string
      safe_domains:
        description: "Optional comma-separated SSO/internal domains"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Pake ${{ matrix.name }} app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            id: windows
            os: windows-latest
            rust: stable-x86_64-msvc
          - name: macOS
            id: macos
            os: macos-latest
            rust: stable
          - name: Linux
            id: linux
            os: ubuntu-latest
            rust: stable
    defaults:
      run:
        working-directory: third_party/pake
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: third_party/pake/pnpm-lock.yaml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libdbus-1-dev \
            libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev \
            pkg-config librsvg2-dev
      - name: Install Pake build dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile Pake CLI
        run: pnpm run cli:build
      - name: Package Windows portable executable
        if: runner.os == 'Windows'
        env:
          PAKE_URL: ${{ inputs.website }}
          PAKE_APP_NAME: ${{ inputs.app_name }}
          PAKE_WIDTH: ${{ inputs.width }}
          PAKE_HEIGHT: ${{ inputs.height }}
          PAKE_SAFE_DOMAINS: ${{ inputs.safe_domains }}
        shell: pwsh
        run: |
          $args = @($env:PAKE_URL, "--name", $env:PAKE_APP_NAME, "--width", $env:PAKE_WIDTH, "--height", $env:PAKE_HEIGHT, "--targets", "x64", "--no-bundle", "--json")
          if ($env:PAKE_SAFE_DOMAINS) { $args += "--safe-domain", $env:PAKE_SAFE_DOMAINS }
          node dist/cli.js @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path output/windows | Out-Null
          $app = Get-ChildItem -Path . -File -Filter "*.exe" | Select-Object -First 1
          if (-not $app) { throw "Pake did not produce a Windows executable." }
          Copy-Item $app.FullName output/windows/
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        env:
          PAKE_URL: ${{ inputs.website }}
          PAKE_APP_NAME: ${{ inputs.app_name }}
          PAKE_WIDTH: ${{ inputs.width }}
          PAKE_HEIGHT: ${{ inputs.height }}
          PAKE_SAFE_DOMAINS: ${{ inputs.safe_domains }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$PAKE_URL" --name "$PAKE_APP_NAME" --width "$PAKE_WIDTH" --height "$PAKE_HEIGHT" --targets app --json)
          if [ -n "$PAKE_SAFE_DOMAINS" ]; then args+=(--safe-domain "$PAKE_SAFE_DOMAINS"); fi
          node dist/cli.js "${args[@]}"
          mkdir -p output/macos
          app_bundle="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          cp -R "$app_bundle" output/macos/
      - name: Package Linux portable AppImage
        if: runner.os == 'Linux'
        env:
          PAKE_URL: ${{ inputs.website }}
          PAKE_APP_NAME: ${{ inputs.app_name }}
          PAKE_WIDTH: ${{ inputs.width }}
          PAKE_HEIGHT: ${{ inputs.height }}
          PAKE_SAFE_DOMAINS: ${{ inputs.safe_domains }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$PAKE_URL" --name "$PAKE_APP_NAME" --width "$PAKE_WIDTH" --height "$PAKE_HEIGHT" --targets appimage --json)
          if [ -n "$PAKE_SAFE_DOMAINS" ]; then args+=(--safe-domain "$PAKE_SAFE_DOMAINS"); fi
          node dist/cli.js "${args[@]}"
          mkdir -p output/linux
          app_image="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$app_image"
          cp "$app_image" output/linux/
      - name: Upload ${{ matrix.name }} app
        uses: actions/upload-artifact@v4
        with:
          name: Pake-${{ inputs.app_name }}-${{ matrix.name }}-${{ github.run_number }}
          path: third_party/pake/output/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
