name: Test

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the Node compatibility promise on Linux while exercising the
          # current runtime on every desktop OS we publish for.
          - name: Ubuntu
            os: ubuntu-latest
            node: 20
          - name: Ubuntu
            os: ubuntu-latest
            node: 22
          - name: macOS
            os: macos-latest
            node: 22
          - name: Windows
            os: windows-latest
            node: 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test core and CLI
        run: npm test
      - name: Verify distributable build
        run: npm run build
      - name: Upload compiled app
        if: matrix.name == 'Ubuntu' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: webtoapp-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
