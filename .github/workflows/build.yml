name: Build Webtoapp package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile Webtoapp
        run: pnpm build
      - name: Smoke test the CLI
        run: node lib/cli.js --help
      - name: Pack npm artifact
        shell: bash
        run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Webtoapp-${{ matrix.os }}-${{ github.run_number }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30
