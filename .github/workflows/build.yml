name: Build portable apps

# Deliberately manual: test.yml is the only workflow that runs on branch pushes and pull requests.
on:
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note displayed with this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  portable:
    name: Portable ${{ matrix.name }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run portable:win
          - name: macOS
            os: macos-latest
            command: npm run portable
          - name: Linux
            os: ubuntu-latest
            command: npm run portable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run test suite
        run: npm test
      - name: Build portable app
        run: ${{ matrix.command }}
      - name: Upload ${{ matrix.name }} portable app
        uses: actions/upload-artifact@v4
        with:
          name: Webtoapp-Studio-Portable-${{ matrix.name }}-${{ github.run_number }}
          path: release/**
          if-no-files-found: error
          retention-days: 30
