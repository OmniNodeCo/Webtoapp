name: Build Windows installer

# Deliberately manual: test.yml is the only workflow that runs automatically.
on:
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note displayed with this build"
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-installer:
    name: Create Windows .exe installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run test suite
        run: npm test
      - name: Build NSIS executable
        run: npx electron-builder --win nsis --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Webtoapp-Studio-Windows-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
