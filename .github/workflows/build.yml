name: Build Webtoapp GUI

# Manual build of the Webtoapp desktop GUI. No website URL form is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} GUI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust: stable-x86_64-msvc
          - name: macOS
            os: macos-latest
            rust: stable
          - name: Linux
            os: ubuntu-latest
            rust: stable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libdbus-1-dev \
            libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev \
            pkg-config librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Webtoapp GUI
        run: pnpm run build
      - name: Upload ${{ matrix.name }} executable
        uses: actions/upload-artifact@v4
        with:
          name: Webtoapp-${{ matrix.name }}-${{ github.run_number }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30
